x-logging: &logging
  driver: local
  options:
    max-size: 50m
    max-file: '1'
    compress: 'false'

services:
  app:
    logging: *logging
    image: gronka-app
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BUILD_TIMESTAMP: ${BUILD_TIMESTAMP:-}
        GIT_COMMIT: ${GIT_COMMIT:-}
    container_name: gronka
    restart: unless-stopped
    # Media streams through disk (never whole files in RAM) and runs in the worker service, so
    # this only has to hold the gateway, the webui and ffmpeg when MEDIA_WORKERS=false.
    mem_limit: ${APP_MEM_LIMIT:-3g}
    depends_on:
      postgres:
        condition: service_healthy
      cobalt:
        condition: service_started
    environment: &app-env
      - DISCORD_TOKEN=${PROD_DISCORD_TOKEN}
      - CLIENT_ID=${PROD_CLIENT_ID}
      - SERVER_PORT=${SERVER_PORT:-3000}
      - MAX_VIDEO_SIZE=${MAX_VIDEO_SIZE:-}
      - MAX_IMAGE_SIZE=${MAX_IMAGE_SIZE:-}
      - STATS_CACHE_TTL=${STATS_CACHE_TTL:-}
      - COBALT_API_URL=${COBALT_API_URL:-http://cobalt:9000}
      - COBALT_ENABLED=${COBALT_ENABLED:-true}
      - R2_ACCOUNT_ID=${R2_ACCOUNT_ID:-}
      - R2_ACCESS_KEY_ID=${R2_ACCESS_KEY_ID:-}
      - R2_SECRET_ACCESS_KEY=${R2_SECRET_ACCESS_KEY:-}
      - R2_BUCKET_NAME=${R2_BUCKET_NAME:-}
      - R2_PUBLIC_DOMAIN=${R2_PUBLIC_DOMAIN:-}
      - R2_CLEANUP_ENABLED=${R2_CLEANUP_ENABLED:-}
      - R2_CLEANUP_INTERVAL_MS=${R2_CLEANUP_INTERVAL_MS:-}
      - RETENTION_ENABLED=${RETENTION_ENABLED:-true}
      - RETENTION_DAYS=${RETENTION_DAYS:-7}
      - RETENTION_INTERVAL_MS=${RETENTION_INTERVAL_MS:-}
      - SUPPORT_INVITE_URL=${SUPPORT_INVITE_URL:-}
      - LOG_LEVEL=${LOG_LEVEL:-}
      - SERVER_HOST=${SERVER_HOST:-}
      - WEBUI_PORT=${WEBUI_PORT:-3001}
      - WEBUI_HOST=${WEBUI_HOST:-0.0.0.0}
      - POSTGRES_HOST=${PROD_POSTGRES_HOST:-postgres}
      - POSTGRES_PORT=${PROD_POSTGRES_PORT:-5432}
      - POSTGRES_USER=${PROD_POSTGRES_USER:-gronka}
      - POSTGRES_PASSWORD=${PROD_POSTGRES_PASSWORD:?run bun run setup, or set PROD_POSTGRES_PASSWORD in .env}
      - POSTGRES_DB=${PROD_POSTGRES_DB:-gronka}
      - DATABASE_URL=${DATABASE_URL:-}
      # Netscape cookies.txt for yt-dlp (age-restricted TikTok etc.); ignored if the file is absent
      - YTDLP_COOKIES_PATH=${YTDLP_COOKIES_PATH:-/app/ytdlp-cookies.txt}
      # The app's own cookie file (cobalt has a separate copy): `instagram` and `reddit` entries
      - INSTAGRAM_COOKIES_PATH=${INSTAGRAM_COOKIES_PATH:-/app/cookies.json}
      # Deferred commands go to the worker service; false runs them inside the bot process.
      - MEDIA_WORKERS=${MEDIA_WORKERS:-true}
      # Proxy for sources that block this server's region, e.g. http://vpn:8888 with the vpn profile
      - GEO_PROXY_URL=${GEO_PROXY_URL:-}
    volumes: &app-volumes
      - ./temp:/app/temp
      # Optional yt-dlp cookies file (export from a logged-in browser in Netscape format).
      # If it doesn't exist on the host, Docker mounts an empty directory and yt-dlp runs without cookies.
      - ./ytdlp-cookies.txt:/app/ytdlp-cookies.txt
      # Read-only, and no longer shared with cobalt, so nothing rewrites it under the app.
      - ./cookies.json:/app/cookies.json:ro
    ports:
      - '${SERVER_PORT:-3000}:${SERVER_PORT:-3000}'
      - '${WEBUI_PORT:-3001}:${WEBUI_PORT:-3001}'
    networks:
      - gronka-network
    healthcheck:
      # probes the stats server over http; the bun image ships a node shim
      test:
        [
          'CMD-SHELL',
          'node -e "require(''http'').get(''http://127.0.0.1:''+(process.env.SERVER_PORT||3000)+''/health'',r=>process.exit(r.statusCode<500?0:1)).on(''error'',()=>process.exit(1))"',
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # Runs media jobs from the media_jobs table and answers users over Discord REST. A job whose
  # worker dies or is redeployed is picked up by another; scale with --scale worker=N.
  worker:
    logging: *logging
    image: gronka-app
    pull_policy: never
    entrypoint: ['bun', 'src/worker.js']
    restart: unless-stopped
    mem_limit: ${WORKER_MEM_LIMIT:-3g}
    # Room to finish what it holds; anything left is handed back to the queue before exit.
    stop_grace_period: 2m
    deploy:
      replicas: ${WORKER_REPLICAS:-2}
    depends_on:
      postgres:
        condition: service_healthy
      cobalt:
        condition: service_started
    environment: *app-env
    volumes: *app-volumes
    networks:
      - gronka-network
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'test $(( $(date +%s) - $(stat -c %Y /app/temp/jobs/$(hostname)/alive) )) -lt 60',
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  postgres:
    logging: *logging
    image: postgres:16-alpine
    container_name: gronka-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${PROD_POSTGRES_USER:-gronka}
      - POSTGRES_PASSWORD=${PROD_POSTGRES_PASSWORD:?run bun run setup, or set PROD_POSTGRES_PASSWORD in .env}
      - POSTGRES_DB=${PROD_POSTGRES_DB:-gronka}
      - PGDATA=/var/lib/postgresql/data/pgdata
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    networks:
      - gronka-network
    healthcheck:
      test:
        ['CMD-SHELL', 'pg_isready -U ${PROD_POSTGRES_USER:-gronka} -d ${PROD_POSTGRES_DB:-gronka}']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  cobalt:
    logging: *logging
    image: ghcr.io/imputnet/cobalt:11
    init: true
    read_only: true
    restart: unless-stopped
    container_name: cobalt
    ports:
      # Host-only: it holds the cookie sessions and has no API key; the app uses cobalt:9000
      - 127.0.0.1:9000:9000/tcp
    environment:
      API_URL: ${COBALT_API_URL:-http://cobalt:9000}
      # Path to cookies.json file for authenticating with services (Twitter, Instagram, Reddit, etc.)
      # Required for accessing content that requires authentication
      COOKIE_PATH: '/cookies.json'
    labels:
      - com.centurylinklabs.watchtower.scope=cobalt
    networks:
      - gronka-network
    volumes:
      # Cobalt's OWN copy: it mounts this read-write and rewrites the file, dropping any service
      # it does not recognise. Sharing one file with the app cost us the reddit entry once.
      - ./cobalt-cookies.json:/cookies.json

  # Optional (COMPOSE_PROFILES=vpn): a Mullvad WireGuard tunnel whose HTTP proxy only the sources
  # flagged geo-blocked use, via GEO_PROXY_URL=http://vpn:8888. No published ports.
  vpn:
    logging: *logging
    image: qmcgaw/gluetun:v3.41.3
    profiles: [vpn]
    container_name: gronka-vpn
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      - VPN_SERVICE_PROVIDER=mullvad
      - VPN_TYPE=wireguard
      - WIREGUARD_PRIVATE_KEY=${VPN_WIREGUARD_PRIVATE_KEY:-}
      - WIREGUARD_ADDRESSES=${VPN_WIREGUARD_ADDRESSES:-}
      - SERVER_CITIES=${VPN_SERVER_CITIES:-New York NY}
      - HTTPPROXY=on
      - HTTPPROXY_LOG=off
      - DOT=off
    networks:
      - gronka-network
      - geo-proxy

  # watchtower updates the cobalt image automatically
  watchtower:
    logging: *logging
    image: ghcr.io/containrrr/watchtower:1.7.1
    restart: unless-stopped
    command: --cleanup --scope cobalt --interval 900 --include-restarting
    environment:
      - DOCKER_API_VERSION=1.52
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - gronka-network

volumes:
  postgres-data:
    driver: local

networks:
  gronka-network:
    driver: bridge
  geo-proxy:
    name: ${GEO_PROXY_NETWORK:-gronka-geo-proxy}
    internal: true
