name: CI

permissions:
  contents: read
  checks: write
  pull-requests: write

on:
  push:
    branches: [main, master]
    paths-ignore:
      - '**.md'
      - '.github/workflows/**'
      - 'docs/**'
  pull_request:
    branches: [main, master]
    paths-ignore:
      - '**.md'
      - '.github/workflows/**'
      - 'docs/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DISCORD_TOKEN: 'ci-test-token'
  CLIENT_ID: 'ci-test-client-id'
  POSTGRES_DB: gronka_test
  POSTGRES_USER: gronka
  POSTGRES_PASSWORD: gronka
  POSTGRES_HOST: localhost
  POSTGRES_PORT: '5432'
  # Explicitly mark test mode. Without this, spawned test-file child processes
  # fail argv-based test detection, run in "prod mode", and execute the serial
  # sequence reset concurrently - racing setval() against parallel inserts and
  # causing intermittent duplicate-key failures.
  TEST_POSTGRES_DB: gronka_test
  # PG* vars for psql client
  PGUSER: gronka
  PGPASSWORD: gronka
  PGHOST: localhost
  PGPORT: '5432'
  PGDATABASE: gronka_test

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: moderate
          config-file: ./.github/dependency-review-config.yml

  validate-code:
    runs-on: ubuntu-latest
    if: github.actor != 'dependabot[bot]'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - run: npm run check:sync
      - run: npm run lint
      - run: npm run format:check || echo "::warning::Formatting check failed"

  test-utils:
    runs-on: ubuntu-latest
    if: github.actor != 'dependabot[bot]'
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: gronka_test
          POSTGRES_USER: gronka
          POSTGRES_PASSWORD: gronka
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg postgresql-client
      - run: psql -c 'DROP SCHEMA IF EXISTS public CASCADE; CREATE SCHEMA public;'
      - run: npx cross-env WEBUI_PORT=3101 R2_ACCOUNT_ID= R2_ACCESS_KEY_ID= R2_SECRET_ACCESS_KEY= R2_BUCKET_NAME= node --test "test/utils/**/*.test.js"

  test-commands:
    runs-on: ubuntu-latest
    if: github.actor != 'dependabot[bot]'
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: gronka_test
          POSTGRES_USER: gronka
          POSTGRES_PASSWORD: gronka
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg postgresql-client
      - run: psql -c 'DROP SCHEMA IF EXISTS public CASCADE; CREATE SCHEMA public;'
      - run: npx cross-env WEBUI_PORT=3101 R2_ACCOUNT_ID= R2_ACCESS_KEY_ID= R2_SECRET_ACCESS_KEY= R2_BUCKET_NAME= node --test "test/commands/**/*.test.js"

  test-scripts:
    runs-on: ubuntu-latest
    if: github.actor != 'dependabot[bot]'
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: gronka_test
          POSTGRES_USER: gronka
          POSTGRES_PASSWORD: gronka
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg postgresql-client
      - run: psql -c 'DROP SCHEMA IF EXISTS public CASCADE; CREATE SCHEMA public;'
      - run: npx cross-env WEBUI_PORT=3101 R2_ACCOUNT_ID= R2_ACCESS_KEY_ID= R2_SECRET_ACCESS_KEY= R2_BUCKET_NAME= node --test "test/scripts/**/*.test.js"

  test-integration:
    runs-on: ubuntu-latest
    if: github.actor != 'dependabot[bot]'
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: gronka_test
          POSTGRES_USER: gronka
          POSTGRES_PASSWORD: gronka
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg postgresql-client
      - run: psql -c 'DROP SCHEMA IF EXISTS public CASCADE; CREATE SCHEMA public;'
      - run: npx cross-env WEBUI_PORT=3101 R2_ACCOUNT_ID= R2_ACCESS_KEY_ID= R2_SECRET_ACCESS_KEY= R2_BUCKET_NAME= node --test test/webui-server-*.test.js test/docker-security.test.js

  test-e2e:
    runs-on: ubuntu-latest
    if: github.actor != 'dependabot[bot]'
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: gronka_test
          POSTGRES_USER: gronka
          POSTGRES_PASSWORD: gronka
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v7
      # Node 24 (matching local dev) guarantees --experimental-test-module-mocks
      # support; on older runtimes the suite silently skips and the job proves nothing.
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg postgresql-client
      - run: psql -c 'DROP SCHEMA IF EXISTS public CASCADE; CREATE SCHEMA public;'
      - run: npm run test:e2e

  dependabot-checks:
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: npm run validate
