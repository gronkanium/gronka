name: CI

permissions:
  contents: read
  checks: write
  pull-requests: write

on:
  push:
    branches: [main, master]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    branches: [main, master]
    paths-ignore:
      - '**.md'
      - 'docs/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DISCORD_TOKEN: 'ci-test-token'
  CLIENT_ID: 'ci-test-client-id'
  POSTGRES_DB: gronka_test
  POSTGRES_USER: gronka
  POSTGRES_PASSWORD: gronka
  POSTGRES_HOST: localhost
  POSTGRES_PORT: '5432'
  # Explicitly mark test mode. Without this, spawned test-file child processes
  # fail argv-based test detection, run in "prod mode", and execute the serial
  # sequence reset concurrently - racing setval() against parallel inserts and
  # causing intermittent duplicate-key failures.
  TEST_POSTGRES_DB: gronka_test
  # PG* vars for psql client
  PGUSER: gronka
  PGPASSWORD: gronka
  PGHOST: localhost
  PGPORT: '5432'
  PGDATABASE: gronka_test
  # Keep in step with the oven/bun tag in the Dockerfile.
  BUN_VERSION: '1.3'

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: moderate
          config-file: ./.github/dependency-review-config.yml

  # The real lockfile-aware dependency gate. GitHub's dependency graph does NOT parse
  # bun.lock: after the npm->bun port the SBOM fell from 345 packages to 37, and those 37
  # are just package.json's direct deps plus Actions refs, carrying raw semver ranges
  # ("^14.27.0") instead of resolved versions. So dependency-review above has had no
  # transitive data to check since 7df18e8 - it returned success on the very PR that
  # swapped the lockfile format, which is only possible against an empty diff.
  #
  # Both jobs are kept on purpose: dependency-review still covers the Actions ecosystem and
  # starts working again for free if GitHub adds bun.lock support. This job reads bun.lock
  # directly and sees all ~310 resolved packages. Unlike dependency-review it also runs on
  # push (not just PRs) and is not skipped for dependabot, which is exactly when a
  # dependency audit is most useful.
  #
  # `bun audit` was verified to exit 1 on a real advisory (minimist 1.2.0), not merely print
  # one - a gate that always exits 0 would repeat the failure it exists to fix.
  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # pinned to a tag's commit — tags are movable, SHAs are not
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      # severity threshold matches dependency-review's fail-on-severity
      - run: bun audit --audit-level=moderate

  validate-code:
    runs-on: ubuntu-latest
    if: github.actor != 'dependabot[bot]'
    steps:
      - uses: actions/checkout@v7
      # pinned to a tag's commit — tags are movable, SHAs are not
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - run: bun run check:sync
      - run: bun run lint
      - run: bun run format:check || echo "::warning::Formatting check failed"

  # Single job for the whole unit suite. Under `node --test` this was split across four
  # directory-sharded jobs because forking a process per file made a full run slow; `bun test`
  # runs all 51 files in one process in ~15s, so the shards only bought four Postgres services
  # and four chances to typo a path filter into a silently-empty run.
  test:
    runs-on: ubuntu-latest
    if: github.actor != 'dependabot[bot]'
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: gronka_test
          POSTGRES_USER: gronka
          POSTGRES_PASSWORD: gronka
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg gifsicle imagemagick postgresql-client
      - run: psql -c 'DROP SCHEMA IF EXISTS public CASCADE; CREATE SCHEMA public;'
      - run: bun run test:safe

  test-e2e:
    runs-on: ubuntu-latest
    if: github.actor != 'dependabot[bot]'
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: gronka_test
          POSTGRES_USER: gronka
          POSTGRES_PASSWORD: gronka
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg postgresql-client
      - run: psql -c 'DROP SCHEMA IF EXISTS public CASCADE; CREATE SCHEMA public;'
      # GRONKA_E2E (set by the script) is what un-skips the module-mock suites, and
      # run-e2e-tests.js fails on zero discovered files, so this job cannot pass vacuously.
      - run: bun run test:e2e

  dependabot-checks:
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]'
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: bun run validate
