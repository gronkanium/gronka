name: release-please

on:
  push:
    branches: [master]

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      # pinned to a tag's commit — tags are movable, SHAs are not
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        id: release
        with:
          config-file: .github/release-please-config.json
          manifest-file: .github/release-please-manifest.json

      # The bot is a first-time contributor forever, so its PR runs wait for approval and block the checks.
      - name: Approve CI on the release pull request
        if: ${{ steps.release.outputs.prs_created == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          branch=$(gh pr list --repo "$GITHUB_REPOSITORY" --label 'autorelease: pending' --state open --json headRefName --jq '.[0].headRefName')
          [ -n "$branch" ] || exit 0
          for attempt in $(seq 1 12); do
            held=$(gh run list --repo "$GITHUB_REPOSITORY" --branch "$branch" --event pull_request --status action_required \
              --json databaseId,workflowName --jq 'group_by(.workflowName) | map(max_by(.databaseId).databaseId) | .[]')
            [ -n "$held" ] && break
            sleep 10
          done
          for id in $held; do gh api -X POST "repos/$GITHUB_REPOSITORY/actions/runs/$id/approve"; done

  # Docker image build lives here (not in a tag-triggered workflow) because tags
  # created by release-please's GITHUB_TOKEN cannot trigger other workflows.
  docker-image:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver: docker-container

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/gronka:${{ needs.release-please.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/gronka:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
