version: 2
updates:
  - package-ecosystem: 'bun'
    directory: '/'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 10
    groups:
      security-updates:
        patterns:
          - '*'
    commit-message:
      prefix: 'deps'
      include: 'scope'

  - package-ecosystem: 'pip'
    directory: '/docker'
    # yt-dlp ships extractor fixes for broken sites several times a week.
    schedule:
      interval: 'daily'
    commit-message:
      prefix: 'deps'
      include: 'scope'

  - package-ecosystem: 'docker-compose'
    directory: '/'
    schedule:
      interval: 'weekly'
    # A major Postgres can't open the old data directory; that upgrade needs a migration.
    ignore:
      - dependency-name: 'postgres'
        update-types: ['version-update:semver-major']
    commit-message:
      prefix: 'deps'
      include: 'scope'

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    commit-message:
      prefix: 'ci'
