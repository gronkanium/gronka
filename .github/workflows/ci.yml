name: CI

permissions:
  contents: read
  checks: write
  pull-requests: write

on:
  push:
    branches: [main, master]
    paths-ignore:
      - '**.md'
      - '.github/workflows/**'
      - 'docs/**'
  pull_request:
    branches: [main, master]
    paths-ignore:
      - '**.md'
      - '.github/workflows/**'
      - 'docs/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_ENV: test
  DISCORD_TOKEN: 'ci-test-token'
  CLIENT_ID: 'ci-test-client-id'
  POSTGRES_USER: gronka
  POSTGRES_PASSWORD: gronka
  POSTGRES_HOST: localhost
  POSTGRES_PORT: '5432'
  PGUSER: gronka
  PGPASSWORD: gronka
  PGHOST: localhost
  PGPORT: '5432'

jobs:
  dependency-review:
    name: Dependency Review
    runs-on: blacksmith-4vcpu-ubuntu-2404
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: moderate
          config-file: ./.github/dependency-review-config.yml

  validate-code:
    name: Lint & Format
    runs-on: blacksmith-4vcpu-ubuntu-2404
    if: github.actor != 'dependabot[bot]'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run check:sync
      - run: npm run lint
      - run: npm run format:check || echo "::warning::Formatting check failed"

  test:
    name: Test (${{ matrix.suite }})
    runs-on: blacksmith-4vcpu-ubuntu-2404
    if: github.actor != 'dependabot[bot]'
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: utils
            db: gronka_test_utils
            path: test/utils/
          - suite: commands
            db: gronka_test_commands
            path: test/commands/
          - suite: scripts
            db: gronka_test_scripts
            path: test/scripts/
          - suite: integration
            db: gronka_test_integration
            path: test/webui-server-*.test.js test/docker-security.test.js
    env:
      POSTGRES_DB: ${{ matrix.db }}
      PGDATABASE: ${{ matrix.db }}
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ${{ matrix.db }}
          POSTGRES_USER: gronka
          POSTGRES_PASSWORD: gronka
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg postgresql-client
      - run: npx cross-env WEBUI_PORT=3101 R2_ACCOUNT_ID= R2_ACCESS_KEY_ID= R2_SECRET_ACCESS_KEY= R2_BUCKET_NAME= node --test ${{ matrix.path }}

  dependabot-checks:
    name: Dependabot Validate
    runs-on: blacksmith-4vcpu-ubuntu-2404
    if: github.actor == 'dependabot[bot]'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: npm run validate
