<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>gronka</title>
    <meta name="description" content="paste a link, get the file. coming soon." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link
      rel="preload"
      href="/fonts/Archivo-Regular.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/Archivo-ExpandedExtraBold.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <style>
      /* Archivo (OFL) and Gronka Mono, a renamed IBM Plex Mono subset (OFL): /fonts/OFL-*.txt */
      @font-face {
        font-family: 'Archivo';
        src: url('/fonts/Archivo-Regular.woff2') format('woff2');
        font-weight: 400;
        font-display: block;
      }
      @font-face {
        font-family: 'Archivo';
        src: url('/fonts/Archivo-SemiBold.woff2') format('woff2');
        font-weight: 600 700;
        font-display: block;
      }
      @font-face {
        font-family: 'Archivo Expanded';
        src: url('/fonts/Archivo-ExpandedExtraBold.woff2') format('woff2');
        font-weight: 800;
        font-display: block;
      }
      @font-face {
        font-family: 'Gronka Mono';
        src: url('/fonts/GronkaMono-Regular.woff2') format('woff2');
        font-weight: 400;
        font-display: block;
      }
      html {
        scrollbar-width: none;
      }
      html::-webkit-scrollbar {
        display: none;
      }
      :root {
        color-scheme: light dark;
        --bg: #f6f5f1;
        --fg: #111;
        --dim: #6b6b6b;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0e0e0e;
          --fg: #f2f2f2;
          --dim: #8a8a8a;
        }
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        background: var(--bg);
        color: var(--fg);
        font:
          16px/1.5 'Archivo',
          sans-serif;
        padding: 0 16px;
      }
      main {
        max-width: 32rem;
      }
      h1 {
        font-family: 'Archivo Expanded', 'Archivo', sans-serif;
        font-weight: 800;
        font-size: clamp(2.5rem, 9vw, 4rem);
        letter-spacing: -0.02em;
        margin: 0 0 0.25rem;
      }
      p {
        color: var(--dim);
        margin: 0.25rem 0;
      }
      a {
        color: inherit;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>gronka</h1>
      <p>paste a link, get the file. the web version is coming soon.</p>
      <p>
        <a href="/docs/">api docs (preview)</a> · <a href="https://gronka.dev">the discord bot</a>
      </p>
    </main>
  </body>
</html>
