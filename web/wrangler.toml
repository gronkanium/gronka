name = "gronka-web"
compatibility_date = "2026-09-01"
upload_source_maps = false
workers_dev = false
routes = [{ pattern = "web.gronka.dev", custom_domain = true }]

# the per-site pages and sitemap are not in git; every deploy builds them
[build]
command = "bun pages.mjs && npx prettier --write --log-level warn public/index.html 'public/*/index.html'"

[assets]
directory = "public"

[observability]
enabled = false
